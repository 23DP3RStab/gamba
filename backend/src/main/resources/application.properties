spring.application.name=backend

# Database and JWT settings come from the env file (KEY=value lines) next to pom.xml.
# The second path is for starting the app from the repository root.
spring.config.import=optional:file:./env[.properties],optional:file:./backend/env[.properties]

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Hibernate creates and updates the tables from the entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

gamba.jwt.secret=${JWT_SECRET}
gamba.jwt.expiration-ms=${JWT_EXPIRATION_MS}

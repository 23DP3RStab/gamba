spring.application.name=backend

# Tests run against an in-memory H2 database, so they need no PostgreSQL or env file
spring.datasource.url=jdbc:h2:mem:gamba;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

gamba.jwt.secret=test-secret-that-is-at-least-32-bytes
gamba.jwt.expiration-ms=3600000
